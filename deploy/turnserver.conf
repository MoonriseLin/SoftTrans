# coturn for Softdrop (install as /etc/turnserver.conf). STUN + TURN with REST-style
# time-limited credentials minted by the signaling server from the shared secret.

listening-port=3478
tls-listening-port=5349
# Relay range kept small and clear of other services on this host.
min-port=49160
max-port=49999

realm=mio.pantsu.uk
server-name=mio.pantsu.uk
use-auth-secret
static-auth-secret=__TURN_SECRET__

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Only used by TURN-over-TCP/TLS clients; DTLS on the UDP port is not needed.
no-dtls

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Keep the relay from reaching private or local networks behind the VPS.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff

# Cost and abuse limits. Relay traffic counts against VPS bandwidth.
total-quota=100
user-quota=48
max-bps=12500000
stale-nonce=600

log-file=syslog
simple-log
# Logs every allocation, permission and session end (with byte counts). Handy while testing;
# remove `verbose` later if the journal gets too chatty.
verbose
