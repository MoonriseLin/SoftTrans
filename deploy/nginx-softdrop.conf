# Softdrop on https://mio.pantsu.uk:8443  (install as /usr/local/nginx/servers/mio.pantsu.uk.conf)
# Node listens on 127.0.0.1:8480 only. nginx terminates TLS and passes the real client IP.

server {
    listen                     80;
    listen                     [::]:80;
    server_name                mio.pantsu.uk;

    location ^~ /.well-known/acme-challenge/ {
        root                   /var/www/acme;
        default_type           text/plain;
        try_files              $uri =404;
    }

    location / {
        return                 301 https://$host:8443$request_uri;
    }
}

server {
    listen                     8443 ssl;
    listen                     [::]:8443 ssl;
    http2                      on;
    server_name                mio.pantsu.uk;

    ssl_certificate            /etc/letsencrypt/live/mio.pantsu.uk/fullchain.pem;
    ssl_certificate_key        /etc/letsencrypt/live/mio.pantsu.uk/privkey.pem;
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Plain HTTP sent to the TLS port: send it to the right scheme.
    error_page 497 =301 https://$host:8443$request_uri;

    # No transfer data passes through here (it goes over WebRTC), so keep bodies tiny.
    client_max_body_size       16k;

    location = /ws {
        proxy_pass             http://127.0.0.1:8480;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $connection_upgrade;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $remote_addr;
        proxy_read_timeout     1h;
        proxy_send_timeout     1h;
        proxy_buffering        off;
    }

    location / {
        proxy_pass             http://127.0.0.1:8480;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
    }
}
